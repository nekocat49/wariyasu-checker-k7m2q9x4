name: Update data and deploy Pages

on:
  schedule:
    # 平日 09:30 JST (前場開始30分後) = 00:30 UTC (Mon-Fri)
    - cron: '30 0 * * 1-5'
    # 平日 12:30 JST (後場開始) = 03:30 UTC (Mon-Fri)
    - cron: '30 3 * * 1-5'
    # 平日 15:30 JST (後場終了30分後) = 06:30 UTC (Mon-Fri)
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update data.json
        run: python update_data.py
        # update_data.py exits 1 when all stocks fail; the job stops here
        # and the previously published data.json is left untouched.
      - name: Commit updated data.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update data.json (scheduled update)"
          git push
      - name: Prepare Pages artifact (only index.html + data.json)
        run: |
          mkdir -p _site
          cp index.html data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
